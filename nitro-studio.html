<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NitroStudio - MultiverseOps Control Console</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }
    .badge {
      background-color: #0369a1;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background-color: #0369a1; }
    .synthesis-box {
      background-color: #0f172a;
      border: 1px solid #0284c7;
      border-radius: 8px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌌 NitroStudio: MultiverseOps Control Console</div>
    <div class="badge">Model Context Protocol (MCP) Enabled</div>
  </div>

  <div style="margin-bottom: 20px;">
    <button class="btn" onclick="runSimulation()">Run 30-Universe Speculative Matrix</button>
  </div>

  <div class="grid" id="universeGrid">
    <!-- 30 Universe Cards populated via JavaScript -->
  </div>

  <div class="synthesis-box" id="synthesisBox">
    <h3 style="color: #38bdf8; margin-top: 0;">🧠 Quantum Synthesis & Agentic Self-Healing Plan</h3>
    <p>Click "Run 30-Universe Speculative Matrix" to simulate live speculative tool executions across 6 Enterprise Domains.</p>
  </div>

  <script>
    async function runSimulation() {
      const grid = document.getElementById('universeGrid');
      const synthesisBox = document.getElementById('synthesisBox');
      grid.innerHTML = '<p style="color: #94a3b8;">Simulating 30 Speculative Universes on NitroStack...</p>';

      try {
        const response = await fetch('/api/multiverse/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: "Deploy global enterprise infrastructure & pricing update" })
        });
        const data = await response.json();

        grid.innerHTML = '';
        data.results.forEach(u => {
          const card = document.createElement('div');
          card.className = 'card';
          const isPass = u.status === 'SUCCESS';
          card.innerHTML = `
            <div class="card-header">
              <span>[U${String(u.id).padStart(2, '0')}] ${u.domain}</span>
              <span class="${isPass ? 'pass' : 'fail'}">${isPass ? '✅ PASS' : '❌ FAIL'}</span>
            </div>
            <div style="font-size: 12px; color: #94a3b8;">${u.name}</div>
          `;
          grid.appendChild(card);
        });

        let patchHtml = data.synthesis.patches.map(p => `<li style="color: #4ade80;">${p}</li>`).join('');
        synthesisBox.innerHTML = `
          <h3 style="color: #38bdf8; margin-top: 0;">🧠 Quantum Synthesis & Agentic Self-Healing Plan</h3>
          <p><strong>Simulation Certainty Score:</strong> <span style="color: #4ade80;">${data.synthesis.certaintyScore}</span></p>
          <p><strong>Universes Succeeded:</strong> ${data.successCount}/30 | <strong>Failures Intercepted:</strong> ${data.failureCount}</p>
          <h4>🛠️ Auto-Synthesized Remediation Patches:</h4>
          <ul>${patchHtml}</ul>
          <p style="background-color: #166534; padding: 10px; border-radius: 4px; color: #fff;">✅ <strong>REALITY EXECUTION:</strong> Executing Remediated Plan via Production MCP Tools (100% Success in Production)</p>
        `;
      } catch (err) {
        grid.innerHTML = `<p style="color: #f87171;">Error running simulation: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
